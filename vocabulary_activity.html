<div class="wrap">
<header><div class="brand">단어쏙<span style="color:#e0a34a">.</span></div><span class="pill">재훈이의 단어 시간 🌱</span></header>
<div class="round-bar"><strong id="roundLabel">하루 한 걸음</strong><span>남은 단어 <b id="remaining">5</b>개 <span class="timer" id="timer">0:00</span></span></div>
<progress id="progress" max="5" value="0" aria-label="이번 라운드 진행률"></progress>
<div id="setup"><label for="day" class="small">복습할 단어</label><select id="day" aria-label="복습할 학습일"><option value="all">모든 학습일</option><option value="10/12">10월 12일</option><option value="10/13">10월 13일</option><option value="10/14">10월 14일</option><option value="10/15">10월 15일</option></select></div>
<main class="card" id="main"></main>
<footer><span id="storageBadge">이 기기에 저장 · 서버 연결 없음</span><button class="text-button" id="export">기록 내려받기</button><span id="saved" hidden></span></footer>
</div>
<script>
'use strict';
const groups=[['10/12','LST6A 3권 05차시',[['battery','건전지'],['loose','헐거운, 느슨한'],['activity','활동'],['practice','연습'],['try out','지원하다'],['hammer','망치'],['wagon','화물 수레'],['paddle','보트용 노'],['napkin','냅킨'],['win','이기다'],['simple','간단한'],['middle','중간'],['puddle','물웅덩이'],['August','8월'],['group','단체']]],['10/13','LST6A 4권 01차시',[['glad','기쁜'],['plan','계획'],['arrive','도착하다'],['invite','초대하다'],['text message','문자메시지'],['respond','응답하다'],['right away','즉시, 당장'],['fun','재미']]],['10/14','LST6A 4권 02차시',[['not','아닌'],['bottom','아래'],['doctor','의사'],['get','얻다'],['center','중심'],['yellow','노랑'],['follow','따르다'],['pepper','후추']]],['10/15','LST6A 4권 03차시',[['early','일찍'],['look forward to','~를 기대하다'],['fantastic','환상적인'],['enjoy','즐기다'],['terrible','끔찍한'],['shy','부끄러워하는'],['late','늦은'],['front','앞']]]];
const words=groups.flatMap(([day,lesson,entries])=>entries.map(([word,meaning])=>({id:word,word,meaning,day,lesson,originalQuiz:{correct:word!=='arrive',selectedAnswer:word==='arrive'?'출발하다':meaning}})));
const $=id=>document.getElementById(id), KEY='vocassok.review.v1', Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
const secure=window.isSecureContext, canRecognize=!!Recognition&&secure;
let db={version:1,history:[],session:null},storageOK=true;
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(parsed.version===1&&Array.isArray(parsed.history))db=parsed;}localStorage.setItem(KEY,JSON.stringify(db));}catch(e){storageOK=false;}
let session=db.session, current=null, stage='start', options=[], recognition=null,busy=false,speech=null,speechTimeout=null,speechSequence=0,recognitionTimeout=null,runToken=0,answerLocked=false,autoAdvanceTimer=null,lastTick=performance.now();
const localDate=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function save(){db.session=session;try{localStorage.setItem(KEY,JSON.stringify(db));$('saved').textContent='로컬 저장됨 · '+new Date().toLocaleTimeString('ko-KR');}catch(e){storageOK=false;$('saved').textContent='저장 불가 · 기록을 내려받아 보관하세요.';}if(!storageOK)$('storageBadge').textContent='임시 메모리 · 저장 불가 · 서버 연결 없음';}
function blank(id){return {id,reading:{firstRecognized:null,audioHelp:false,retries:0,attempts:0,independent:false,passed:false,selfChecked:false,needsRecheck:false},meaning:{firstCorrect:null,retries:0,attempts:0,passed:false,needsRecheck:false,delayedPassed:null},visits:0,done:false,deferred:false,due:0};}
function selected(){return words.filter(w=>!session||session.filter==='all'||w.day===session.filter);}
function activeRecords(){return session?Object.values(session.items):[];}
const ROUND_SIZE=5;
function roundGroups(){const ids=session?Object.keys(session.items):words.map(w=>w.id);return Array.from({length:Math.ceil(ids.length/ROUND_SIZE)},(_,i)=>ids.slice(i*ROUND_SIZE,(i+1)*ROUND_SIZE));}
function roundRecords(){if(!session)return [];session.roundIndex??=0;return (roundGroups()[session.roundIndex]||[]).map(id=>session.items[id]);}
function updateStats(){const rs=roundRecords(),done=rs.filter(r=>r.done);$('remaining').textContent=session?rs.length-done.length:ROUND_SIZE;$('roundLabel').textContent=session?`라운드 ${session.roundIndex+1} / ${roundGroups().length}`:'한 번에 5개씩';$('progress').max=rs.length||ROUND_SIZE;$('progress').value=done.length;const sec=Math.floor((session?.elapsed||0)/1000);$('timer').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');}
function start(){stopMedia();const filter=$('day').value;session={id:Date.now().toString(),date:localDate(),filter,roundIndex:0,elapsed:0,turn:0,items:Object.fromEntries(words.filter(w=>filter==='all'||w.day===filter).map(w=>[w.id,blank(w.id)])),completed:false};save();next();}
function welcome(){stopMedia();stage='start';current=null;$('setup').hidden=false;$('day').disabled=false;$('main').innerHTML=`<div class="center"><div class="celebrate">🌱</div><h2>딱 5개, 가볍게 시작해요</h2><p class="muted">소리 내어 읽고 뜻을 찾아봐요.</p><div class="round-dots">${'<span class="round-dot"></span>'.repeat(5)}</div></div><div class="actions">${session&&!session.completed?'<button class="primary" id="resume">이어서 하기</button>':''}<button class="${session&&!session.completed?'quiet':'primary'}" id="start">${session?'새로 시작':'첫 라운드 시작 →'}</button></div>`;$('start').onclick=start;if($('resume'))$('resume').onclick=next;updateStats();}
function next(){clearTimeout(autoAdvanceTimer);answerLocked=false;stopMedia();$('setup').hidden=true;$('day').disabled=true;const pending=roundRecords().filter(r=>!r.done&&!r.deferred);if(!pending.length){finish();return;}let ready=pending.filter(r=>r.due<=session.turn);if(!ready.length)ready=pending.sort((a,b)=>a.due-b.due);const r=ready[0];current=words.find(w=>w.id===r.id);r.visits++;r.meaning.visitWrong=false;stage=r.reading.passed?'meaning':'reading';options=[];render();save();}
function rec(){return session.items[current.id];}
function render(message=''){const r=rec();$('main').innerHTML=`<div class="steps"><b>${stage==='reading'?'●':'✓'} 읽기 확인</b><span>→</span><b>${stage==='meaning'?'●':'○'} 뜻 확인</b></div><div class="word">${current.word}</div><div class="word-meta">${r.visits>1?'한 번 더 도전!':''}</div><div id="status" class="status center" role="status" aria-live="polite"></div><div id="activity"></div>`;$('status').textContent=message;
if(stage==='reading'){$('activity').innerHTML=`<div class="mic-area"><button class="mic-button" id="read" aria-label="마이크 켜고 읽기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg></button><div class="mic-label" id="micLabel">눌러서 읽어 주세요</div><div class="sound-bars" id="soundBars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div><div id="transcript" class="transcript" role="status" aria-live="polite"></div><div id="recovery" class="actions" hidden></div>`;$('read').onclick=read;if(!canRecognize){$('read').disabled=true;micState('idle','마이크를 사용할 수 없어요');showRecovery('이 브라우저는 음성인식을 지원하지 않아요.');}}

else{if(!options.length)options=shuffle([current.meaning,...shuffle(words.filter(w=>w.meaning!==current.meaning).map(w=>w.meaning)).slice(0,3)]);$('activity').innerHTML='<p class="center muted">이 단어의 뜻을 골라 주세요.</p><div class="choices" id="choices"></div>';options.forEach((m,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+m;b.onclick=()=>choose(m,b);$('choices').append(b);});}
updateStats();if(stage==='meaning')speak({readingHelp:false});}
function shuffle(a){return [...a].sort(()=>Math.random()-.5);}
function normalize(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
function micState(state,label){if($('read'))$('read').className='mic-button '+(state==='listening'?'listening':state==='connecting'?'connecting':'');if($('micLabel'))$('micLabel').textContent=label;if($('soundBars'))$('soundBars').className='sound-bars'+(state==='listening'?' active':'');}
function setBusy(value){busy=value;lastTick=performance.now();if($('read'))$('read').disabled=!canRecognize||(value&&!recognition);}
function showRecovery(message){$('status').textContent=message;const box=$('recovery');if(!box)return;box.hidden=false;box.innerHTML='<button class="quiet" id="practiceOnly">마이크 없이 연습하기</button>';$('practiceOnly').onclick=()=>{const r=rec();r.reading.selfChecked=true;r.reading.passed=true;r.reading.independent=false;r.reading.needsRecheck=false;stage='meaning';render();save();};}
function stopMedia(){runToken++;speechSequence++;clearTimeout(speechTimeout);clearTimeout(recognitionTimeout);if(recognition){recognition.onend=null;recognition.onerror=null;recognition.onresult=null;try{recognition.abort();}catch(e){}recognition=null;}if(window.speechSynthesis)window.speechSynthesis.cancel();speech=null;busy=false;lastTick=performance.now();}
function speak({readingHelp=stage==='reading'}={}){const synthesis=window.speechSynthesis,Utterance=window.SpeechSynthesisUtterance;if(!synthesis||!Utterance)return;const r=rec();if(readingHelp){r.reading.audioHelp=true;r.reading.independent=false;r.reading.needsRecheck=true;save();}const sequence=++speechSequence,token=runToken;clearTimeout(speechTimeout);if(speech){speech.onend=null;speech.onerror=null;}synthesis.cancel();setBusy(true);const u=new Utterance(current.word);speech=u;u.lang='en-US';u.rate=.82;const voice=synthesis.getVoices().find(v=>v.lang==='en-US');if(voice)u.voice=voice;let ended=false;const end=(error)=>{if(ended||token!==runToken||sequence!==speechSequence)return;ended=true;clearTimeout(speechTimeout);speech=null;setBusy(false);if(readingHelp){micState('idle','다시 눌러 읽어 주세요');if(error)$('status').textContent='다시 읽어 볼까요?';}else if(error&&!answerLocked){$('status').textContent='소리를 재생하지 못했어요. 뜻을 골라 주세요.';}};u.onend=()=>end(false);u.onerror=()=>end(true);speechTimeout=setTimeout(()=>{if(token!==runToken||sequence!==speechSequence)return;synthesis.cancel();end(true);},12000);if(readingHelp)micState('idle','잘 듣고 따라 읽어 봐요');try{synthesis.speak(u);}catch(e){end(true);}}
function read(){if(recognition){recognition.stop();micState('connecting','인식 결과 확인 중…');return;}if(!canRecognize||busy)return;const r=rec(),token=runToken;let resultReceived=false,ended=false;let sr;try{sr=new Recognition();}catch(e){showRecovery('이 브라우저에서는 음성인식을 시작할 수 없어요.');return;}recognition=sr;sr.lang='en-US';sr.interimResults=true;sr.maxAlternatives=3;setBusy(true);$('recovery').hidden=true;$('transcript').textContent='';$('status').textContent='';micState('connecting','마이크 연결 중…');
const end=()=>{if(ended)return;ended=true;clearTimeout(recognitionTimeout);recognition=null;if(token===runToken){setBusy(false);micState('idle','눌러서 다시 읽기');}};
const armTimeout=(ms,message)=>{clearTimeout(recognitionTimeout);recognitionTimeout=setTimeout(()=>{if(token!==runToken||ended)return;resultReceived=true;end();try{sr.abort();}catch(e){}showRecovery(message);},ms);};
sr.onstart=()=>{if(token!==runToken||ended)return;micState('connecting','마이크 입력 연결 중…');armTimeout(30000,'음성인식 서비스가 응답하지 않아요. Chrome에서 HTTPS 주소 또는 localhost로 다시 열어 주세요.');};
sr.onaudiostart=()=>{if(token!==runToken||ended)return;micState('listening','듣고 있어요 · 읽어 주세요');armTimeout(30000,'마이크 입력은 열렸지만 인식 결과가 없어요. 마이크 입력 장치와 음성인식 서비스 연결을 확인해 주세요.');};
sr.onspeechstart=()=>{if(token!==runToken||ended)return;micState('listening','목소리가 들려요…');};
sr.onspeechend=()=>{if(token!==runToken||ended)return;micState('connecting','말한 내용을 확인하고 있어요…');armTimeout(20000,'목소리는 감지했지만 인식 서비스에서 결과를 받지 못했어요. 연결을 확인하고 다시 시도해 주세요.');};
sr.onaudioend=()=>{if(token!==runToken||ended)return;micState('connecting','인식 결과를 기다리고 있어요…');};
sr.onresult=e=>{if(token!==runToken||ended)return;const result=e.results[e.resultIndex||0],alternatives=Array.from(result).map(x=>x.transcript);$('transcript').textContent=alternatives[0]||'';$('transcript').className='transcript'+(result.isFinal===false?' interim':'');if(result.isFinal===false)return;resultReceived=true;const matched=alternatives.some(t=>normalize(t)===normalize(current.word));if(r.reading.firstRecognized===null)r.reading.firstRecognized=matched;r.reading.attempts++;r.reading.retries=Math.max(0,r.reading.attempts-1);r.reading.lastTranscript=alternatives[0]||'';end();try{sr.stop();}catch(e){}if(matched){r.reading.passed=true;r.reading.independent=!r.reading.audioHelp&&!r.reading.selfChecked;r.reading.needsRecheck=r.reading.audioHelp&&r.visits===1;if(r.meaning.passed&&!r.reading.needsRecheck){advance();}else{stage='meaning';render('✓ '+alternatives[0]+' · 잘 읽었어요!');}}else{r.reading.needsRecheck=true;$('status').textContent='한 번 더 읽어 볼까요?';speak();if(r.reading.attempts>=2)showRecovery('한 번 더 읽거나, 마이크 없이 연습해 보세요.');}save();};
sr.onerror=e=>{if(token!==runToken||ended)return;resultReceived=true;end();const messages={'not-allowed':'마이크 권한이 거부됐어요. 브라우저에서 마이크를 허용해 주세요.','service-not-allowed':'음성인식 서비스를 사용할 수 없어요.','audio-capture':'마이크 연결을 확인해 주세요.','network':'음성인식 서비스에 연결하지 못했어요. 인터넷 연결을 확인하고 Chrome에서 HTTPS 주소 또는 localhost로 실행해 주세요.','no-speech':'목소리가 들리지 않았어요. 다시 눌러 읽어 주세요.','aborted':'마이크가 꺼졌어요. 다시 누르면 시작해요.'};showRecovery(messages[e.error]||'마이크를 사용할 수 없어요. 다시 시도해 주세요.');};
sr.onend=()=>{end();if(!resultReceived&&token===runToken)showRecovery('인식된 말이 없어요. 다시 눌러 읽어 주세요.');};
armTimeout(60000,'마이크 연결을 시작하지 못했어요. 사이트 마이크 권한을 확인하고 다시 눌러 주세요.');
try{sr.start();}catch(e){end();showRecovery('마이크를 켜지 못했어요. ('+(e.name||'시작 오류')+')');}}
function choose(m,b){if(answerLocked)return;const r=rec(),correct=m===current.meaning;r.meaning.attempts++;if(r.meaning.firstCorrect===null)r.meaning.firstCorrect=correct;if(!correct){r.meaning.visitWrong=true;r.meaning.retries++;r.meaning.needsRecheck=true;r.meaning.passed=false;b.classList.add('wrong');b.disabled=true;$('status').textContent='다시 생각해 보세요. 다른 뜻을 골라 정답을 확인해요.';speak({readingHelp:false});}else{b.classList.add('correct');document.querySelectorAll('#choices button').forEach(x=>x.disabled=true);if(r.meaning.needsRecheck&&r.visits>1&&!r.meaning.visitWrong&&r.meaning.attempts>1){r.meaning.delayedPassed=true;r.meaning.needsRecheck=false;r.meaning.passed=true;}else if(!r.meaning.needsRecheck)r.meaning.passed=true;$('status').textContent=r.meaning.needsRecheck?'정답이에요! 다른 단어를 본 뒤 한 번 더 확인해요.':'정답이에요! 잘했어요.';answerLocked=true;const selectedSession=session.id,selectedRecord=r;autoAdvanceTimer=setTimeout(()=>{if(session?.id===selectedSession&&current&&rec()===selectedRecord&&stage==='meaning'){advance();}},350);}save();}
function advance(){const r=rec();if(r.reading.passed&&!r.reading.needsRecheck&&r.meaning.passed){r.done=true;const independent=r.reading.independent&&r.meaning.firstCorrect===true;const now=new Date(),due=new Date(now);due.setDate(due.getDate()+(independent?3:1));const prev=[...db.history].reverse().find(h=>h.wordId===r.id&&h.lastIndependentPassDate);db.history.push({sessionId:session.id,wordId:r.id,activityDate:localDate(),reading:structuredClone(r.reading),meaning:structuredClone(r.meaning),independent,lastIndependentPassDate:independent?localDate():prev?.lastIndependentPassDate||null,nextReviewDate:localDate(due),completedAt:now.toISOString()});}else{if(r.reading.needsRecheck)r.reading.passed=false;r.due=session.turn+4;}session.turn++;save();next();}
function finish(){stopMedia();stage='finish';current=null;const rs=roundRecords(),deferred=rs.filter(r=>r.deferred),more=session.roundIndex<roundGroups().length-1;session.completed=!more&&activeRecords().every(r=>r.done);save();updateStats();$('main').innerHTML=`<div class="center"><div class="celebrate">${deferred.length?'🌿':'⭐'}</div><h2>${deferred.length?'잠깐 쉬어도 괜찮아요':`라운드 ${session.roundIndex+1} 성공!`}</h2><p class="muted">${rs.filter(r=>r.done).length}개 단어를 복습했어요.${deferred.length?`<br>${deferred.length}개는 나중에 다시 만나요.`:more?' 다음에도 이만큼만!':' 오늘도 잘했어요!'}</p></div><div class="actions">${deferred.length?'<button class="primary" id="retry">남은 단어 다시 하기</button>':''}${more?`<button class="${deferred.length?'quiet':'primary'}" id="nextRound">다음 라운드 · ${roundGroups()[session.roundIndex+1].length}개 →</button>`:''}<button class="quiet" id="home">오늘은 여기까지</button></div>${!more&&activeRecords().some(r=>!r.done&&!rs.includes(r))?'<div class="actions"><button class="quiet" id="earlier">이전 라운드 남은 단어</button></div>':''}`;if($('retry'))$('retry').onclick=()=>{rs.forEach(r=>r.deferred=false);next();};if($('nextRound'))$('nextRound').onclick=()=>{session.roundIndex++;save();next();};if($('earlier'))$('earlier').onclick=()=>{session.roundIndex=roundGroups().findIndex(ids=>ids.some(id=>!session.items[id].done));roundRecords().forEach(r=>r.deferred=false);save();next();};$('home').onclick=welcome;}
$('export').onclick=()=>{save();const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),words,...db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='vocassok-review-'+localDate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('day').onchange=()=>{if(stage==='start')$('start').textContent='첫 라운드 시작 →';};
setInterval(()=>{const now=performance.now();if(session&&current&&!busy&&!document.hidden){session.elapsed+=Math.min(now-lastTick,1500);}lastTick=now;updateStats();},1000);
setInterval(()=>{if(session&&current)save();},5000);window.addEventListener('pagehide',()=>{stopMedia();save();});document.addEventListener('visibilitychange',()=>{lastTick=performance.now();if(document.hidden)stopMedia();});welcome();
</script>
